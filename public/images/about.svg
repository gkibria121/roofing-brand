<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Illustration of a roofing crew and company truck">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#sky)"/>
  <rect y="700" width="1200" height="200" fill="#e2e8f0"/>
  <!-- truck -->
  <rect x="130" y="420" width="640" height="250" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <rect x="770" y="490" width="230" height="180" rx="14" fill="#0f2a4a"/>
  <polygon points="790,500 880,500 940,570 790,570" fill="#bfdbfe"/>
