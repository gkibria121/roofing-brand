    <g transform="translate(1050 480)"><circle cy="-40" r="26" fill="#e2e8f0"/><path d="M-28 -52a28 28 0 0156 0z" fill="#facc15"/><rect x="-26" y="-12" width="52" height="130" rx="18" fill="#f97316"/><rect x="-22" y="118" width="18" height="100" fill="#1e293b"/><rect x="4" y="118" width="18" height="100" fill="#1e293b"/></g>
    <g transform="translate(1110 500)"><circle cy="-40" r="26" fill="#e2e8f0"/><path d="M-28 -52a28 28 0 0156 0z" fill="#facc15"/><rect x="-26" y="-12" width="52" height="130" rx="18" fill="#0f2a4a"/><rect x="-22" y="118" width="18" height="100" fill="#1e293b"/><rect x="4" y="118" width="18" height="100" fill="#1e293b"/></g>
  </g>
